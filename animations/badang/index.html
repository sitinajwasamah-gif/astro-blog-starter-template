<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badang – Animasi</title>
<style>
  @font-face { font-family: Fredoka; font-weight: 400; src: url(fonts/fredoka-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: #111; color: #eee; font-family: Fredoka, sans-serif; }
  #stage { display: block; width: 1280px; height: 720px; background: #000; }
  body.preview #stage { width: min(100vw, 1280px); height: auto; aspect-ratio: 16 / 9; margin: 0 auto; }
  #controls { display: none; gap: 12px; align-items: center; max-width: 1280px; margin: 10px auto; padding: 0 16px; }
  body.preview #controls { display: flex; }
  #controls input { flex: 1; }
  #controls button { font: inherit; padding: 6px 16px; border-radius: 8px; border: 0; background: #ffcf4a; cursor: pointer; }
  svg text { font-family: Fredoka, sans-serif; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="controls">
  <button id="play">▶ Main</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="0.1">
  <span id="clock">0.0s</span>
</div>
<script>
// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const W = 1280, H = 720;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
// Like P() but 0 outside [a, b): used for things that should disappear again.
const B = (t, a, b) => (t < a || t >= b ? 0 : P(t, a, b));
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const bounce = p => {
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375;
  return n * (p -= 2.625 / d) * p + 0.984375;
};
// Deterministic pseudo-random so every render is identical.
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
// Natural blinking: closed for ~0.12s every few seconds.
const blinkAt = (t, seed = 0) => { const c = (t + seed * 1.7) % 3.3; return c < 0.12 ? 1 : 0; };
const OUT = '#3b2416';
const g = (inner, tr = '') => `<g${tr ? ` transform="${tr}"` : ''}>${inner}</g>`;

// ---------------------------------------------------------------------------
// Characters (chibi style: big round heads, big shiny eyes, rosy cheeks)
// ---------------------------------------------------------------------------
function eyes(o) {
  const { blink = 0, look = 0, mood } = o;
  let s = '';
  for (const sx of [-1, 1]) {
    const ex = sx * 22 + look * 5, ey = -155;
    if (mood === 'happy' || mood === 'eyesclosed' || blink >= 1) {
      // Closed / smiling eyes drawn as arcs.
      const d = mood === 'happy' ? `M ${ex - 9} ${ey + 2} Q ${ex} ${ey - 9} ${ex + 9} ${ey + 2}` : `M ${ex - 9} ${ey} Q ${ex} ${ey + 6} ${ex + 9} ${ey}`;
      s += `<path d="${d}" fill="none" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/>`;
    } else {
      const big = mood === 'shock' ? 1.25 : 1;
      s += `<ellipse cx="${ex}" cy="${ey}" rx="${9 * big}" ry="${12 * big}" fill="#1d120b"/>`;
      s += `<circle cx="${ex + 3}" cy="${ey - 5}" r="${3.8 * big}" fill="#fff"/><circle cx="${ex - 3}" cy="${ey + 4}" r="${1.8 * big}" fill="#fff"/>`;
    }
  }
  return s;
}
function brows(mood) {
  const m = {
    angry: [[-32, -178, -12, -170], [12, -170, 32, -178]],
    worry: [[-32, -170, -12, -177], [12, -177, 32, -170]],
    shock: [[-32, -182, -12, -184], [12, -184, 32, -182]],
    strain: [[-32, -176, -12, -170], [12, -170, 32, -176]],
  }[mood] || [[-31, -176, -13, -178], [13, -178, 31, -176]];
  return m.map(([a, b, c, d]) => `<path d="M ${a} ${b} L ${c} ${d}" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/>`).join('');
}
function mouth(m) {
  switch (m) {
    case 'grin': return `<path d="M -17 -133 Q 0 -106 17 -133 Z" fill="#7a2420" stroke="#1d120b" stroke-width="3" stroke-linejoin="round"/><path d="M -9 -119 Q 0 -112 9 -119 Q 0 -124 -9 -119" fill="#ff7b7b"/>`;
    case 'o': return `<ellipse cx="0" cy="-125" rx="7" ry="9" fill="#7a2420" stroke="#1d120b" stroke-width="3"/>`;
    case 'shout': return `<ellipse cx="0" cy="-123" rx="13" ry="14" fill="#7a2420" stroke="#1d120b" stroke-width="3"/><ellipse cx="0" cy="-116" rx="7" ry="4" fill="#ff7b7b"/>`;
    case 'frown': return `<path d="M -11 -121 Q 0 -132 11 -121" fill="none" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/>`;
    case 'yuck': return `<path d="M -16 -125 q 4 -6 8 0 q 4 6 8 0 q 4 -6 8 0 q 4 6 8 0" fill="none" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/>`;
    case 'strain': return `<rect x="-14" y="-133" width="28" height="12" rx="5" fill="#fff" stroke="#1d120b" stroke-width="3"/><path d="M -14 -127 H 14" stroke="#1d120b" stroke-width="2"/>`;
    case 'chew': return `<path d="M -10 -128 Q 0 -120 10 -128" fill="none" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/><circle cx="-34" cy="-130" r="10" fill="#ffb07a" opacity=".9"/>`;
    case 'flat': return `<path d="M -9 -126 H 9" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/>`;
    default: return `<path d="M -13 -131 Q 0 -117 13 -131" fill="none" stroke="#1d120b" stroke-width="4" stroke-linecap="round"/>`;
  }
}
function arm(sx, ang, color, skin, len = 52, item = '') {
  // ang: degrees from hanging straight down, positive swings outward/up.
  const sxp = sx * 30, syp = -92, a = ang * Math.PI / 180;
  const hx = sxp + sx * Math.sin(a) * len, hy = syp + Math.cos(a) * len;
  return `<path d="M ${sxp} ${syp} L ${hx} ${hy}" stroke="${OUT}" stroke-width="21" stroke-linecap="round"/>
    <path d="M ${sxp} ${syp} L ${sxp + (hx - sxp) * 0.45} ${syp + (hy - syp) * 0.45}" stroke="${color}" stroke-width="16" stroke-linecap="round"/>
    <path d="M ${sxp + (hx - sxp) * 0.45} ${syp + (hy - syp) * 0.45} L ${hx} ${hy}" stroke="${skin}" stroke-width="16" stroke-linecap="round"/>
    ${item ? g(item, `translate(${hx} ${hy}) rotate(${sx * ang})`) : ''}
    <circle cx="${hx}" cy="${hy}" r="10" fill="${skin}" stroke="${OUT}" stroke-width="2.5"/>`;
}
const OUTFITS = {
  hamba:  { shirt: '#d9a05b', sarong: '#8a6a4f', band: '#b8442f', patch: true },
  hulubalang: { shirt: '#2f6fd0', sarong: '#f2c230', band: '#e23d3d' },
};
function person(o) {
  const {
    x = 0, y = 0, s = 1, flip = false, skin = '#c98a5a', hair = '#24160e', outfit = 'hamba',
    mood = 'smile', mouthShape, blink = 0, aL = 12, aR = 12, step = 0, bob = 0, tilt = 0,
    itemL = '', itemR = '', armLen = 52, glow = 0, hat = 'band', extra = '', stache = false, tint = '', look = 0, squash = 1,
  } = o;
  const of = typeof outfit === 'string' ? OUTFITS[outfit] : outfit;
  const legs = [-1, 1].map(sx => {
    const k = sx * step * 10;
    return `<g transform="rotate(${k} ${sx * 13} -22)"><rect x="${sx * 13 - 9}" y="-26" width="18" height="24" rx="8" fill="${skin}" stroke="${OUT}" stroke-width="2.5"/><ellipse cx="${sx * 13 + sx * 3}" cy="-2" rx="13" ry="7" fill="${skin}" stroke="${OUT}" stroke-width="2.5"/></g>`;
  }).join('');
  let hatSvg = '';
  if (hat === 'band') hatSvg = `<path d="M -59 -177 Q 0 -203 59 -177" fill="none" stroke="${OUT}" stroke-width="16" stroke-linecap="round"/><path d="M -59 -177 Q 0 -203 59 -177" fill="none" stroke="${of.band}" stroke-width="11" stroke-linecap="round"/><path d="M 52 -182 q 20 -4 26 10 q -16 2 -22 -4 M 52 -180 q 16 6 14 22 q -12 -8 -12 -16" fill="${of.band}" stroke="${OUT}" stroke-width="2.5"/>`;
  if (hat === 'songkok') hatSvg = `<path d="M -46 -196 L -42 -228 Q 0 -238 42 -228 L 46 -196 Q 0 -206 -46 -196 Z" fill="#1c1c24" stroke="${OUT}" stroke-width="2.5"/>`;
  if (hat === 'crown') hatSvg = `<path d="M -50 -196 Q 0 -212 50 -196 L 54 -226 L 32 -212 L 16 -240 L 0 -214 L -16 -240 L -32 -212 L -54 -226 Z" fill="#f6c638" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="0" cy="-205" r="6" fill="#e2374a"/><circle cx="-30" cy="-202" r="4" fill="#3aa3e8"/><circle cx="30" cy="-202" r="4" fill="#3aa3e8"/>`;
  if (hat === 'turban') hatSvg = `<path d="M -62 -180 Q -66 -238 0 -240 Q 66 -238 62 -180 Q 0 -200 -62 -180 Z" fill="#8e44c9" stroke="${OUT}" stroke-width="2.5"/><path d="M -56 -200 Q 0 -222 56 -200 M -50 -220 Q 0 -238 50 -220" stroke="#b77be6" stroke-width="5" fill="none"/><circle cx="0" cy="-206" r="8" fill="#f6c638" stroke="${OUT}" stroke-width="2"/><path d="M 0 -214 q 8 -22 -4 -34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const body = `
    ${legs}
    <path d="M -36 -60 L -40 -20 Q 0 -12 40 -20 L 36 -60 Z" fill="${of.sarong}" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -38 -42 L 38 -42 M -39 -32 L 39 -32" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
    ${arm(-1, aL, of.shirt, skin, armLen, itemL)}
    <rect x="-36" y="-104" width="72" height="54" rx="22" fill="${of.shirt}" stroke="${OUT}" stroke-width="2.5"/>
    ${of.patch ? '<rect x="8" y="-86" width="14" height="12" rx="2" fill="#b98545" stroke="#7b5530" stroke-width="2" stroke-dasharray="3 2"/>' : ''}
    ${outfit === 'hulubalang' ? '<path d="M -36 -64 Q 0 -54 36 -64 L 34 -50 Q 0 -42 -34 -50 Z" fill="#f2c230" stroke="' + OUT + '" stroke-width="2"/><path d="M -8 -104 L 0 -90 L 8 -104" fill="none" stroke="#f2c230" stroke-width="4"/>' : ''}
    ${arm(1, aR, of.shirt, skin, armLen, itemR)}
  `;
  const head = `
    <circle cx="-60" cy="-156" r="11" fill="${skin}" stroke="${OUT}" stroke-width="2.5"/>
    <circle cx="60" cy="-156" r="11" fill="${skin}" stroke="${OUT}" stroke-width="2.5"/>
    <circle cx="0" cy="-158" r="61" fill="${skin}" stroke="${OUT}" stroke-width="3"/>
    ${tint ? `<circle cx="0" cy="-158" r="59" fill="${tint}" opacity=".45"/>` : ''}
    <path d="M -61 -160 Q -66 -224 0 -224 Q 66 -224 61 -160 Q 52 -190 22 -192 Q 26 -182 14 -176 Q 8 -190 -12 -192 Q -12 -180 -26 -176 Q -36 -190 -61 -160 Z" fill="${hair}"/>
    ${eyes({ blink, look, mood })}
    ${brows(mood)}
    <ellipse cx="-37" cy="-133" rx="10" ry="6.5" fill="#ff7f95" opacity=".55"/>
    <ellipse cx="37" cy="-133" rx="10" ry="6.5" fill="#ff7f95" opacity=".55"/>
    <path d="M -3 -142 Q 0 -138 3 -142" fill="none" stroke="#8a4f2f" stroke-width="3" stroke-linecap="round"/>
    ${stache ? '<path d="M -26 -134 Q -12 -146 0 -138 Q 12 -146 26 -134 Q 14 -138 0 -132 Q -14 -138 -26 -134 Z" fill="#1d120b"/>' : ''}
    ${mouth(mouthShape || ({ happy: 'grin', shock: 'o', angry: 'frown', worry: 'frown', strain: 'strain' }[mood] || 'smile'))}
    ${hatSvg}
  `;
  const aura = glow > 0 ? `<ellipse cx="0" cy="-110" rx="${110 + 10 * Math.sin(glow * 20)}" ry="${150 + 10 * Math.sin(glow * 20)}" fill="url(#auraGrad)" opacity="${clamp(glow)}"/>` : '';
  return g(`${aura}<ellipse cx="0" cy="2" rx="46" ry="9" fill="rgba(0,0,0,.18)"/>` +
    g(body + g(head, `rotate(${tilt} 0 -110)`) + extra, `translate(0 ${-bob}) scale(${1 / squash} ${squash})`),
    `translate(${x} ${y}) scale(${flip ? -s : s} ${s})`);
}

function jin(o) {
  const { x = 0, y = 0, s = 1, flip = false, mood = 'smile', blink = 0, aL = 30, aR = 30, t = 0, beard = 0, mouthShape, alpha = 1 } = o;
  const sway = Math.sin(t * 3) * 6;
  const arms = [-1, 1].map(sx => {
    const a = (sx < 0 ? aL : aR) * Math.PI / 180, L = 46;
    const sxp = sx * 40, syp = -96, hx = sxp + sx * Math.sin(a) * L, hy = syp + Math.cos(a) * L;
    return `<path d="M ${sxp} ${syp} Q ${(sxp + hx) / 2 + sx * 8} ${(syp + hy) / 2 - 8} ${hx} ${hy}" stroke="${OUT}" stroke-width="17" fill="none" stroke-linecap="round"/><path d="M ${sxp} ${syp} Q ${(sxp + hx) / 2 + sx * 8} ${(syp + hy) / 2 - 8} ${hx} ${hy}" stroke="#4cc4c0" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="9" fill="#4cc4c0" stroke="${OUT}" stroke-width="2.5"/>`;
  }).join('');
  const bx = beard * 70; // beard pulled forward
  return g(`
    <path d="M -46 -110 C -60 -40 -20 -20 ${-6 + sway} 4 C ${10 + sway} 22 ${-12 + sway} 40 ${-26 + sway} 30 C ${-6 + sway} 56 ${30 + sway} 30 ${22 + sway} 0 C 50 -30 58 -70 46 -110 Z" fill="#4cc4c0" stroke="${OUT}" stroke-width="3"/>
    <path d="M -26 -96 C -30 -50 -6 -30 4 -14 C 18 -34 30 -60 26 -96 Z" fill="#8ee6dd" opacity=".8"/>
    ${arms}
    <path d="M -54 -168 L -86 -190 L -62 -146 Z M 54 -168 L 86 -190 L 62 -146 Z" fill="#4cc4c0" stroke="${OUT}" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="-150" r="60" fill="#4cc4c0" stroke="${OUT}" stroke-width="3"/>
    <path d="M -30 -204 q -10 -30 8 -42 q -2 22 10 30 q 2 -30 22 -36 q -8 24 4 36 q 10 -16 26 -12 q -18 10 -14 26 Z" fill="#3e9b4f" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>
    ${g(eyes({ blink, mood }) + brows(mood), 'translate(0 8)')}
    <ellipse cx="-38" cy="-130" rx="10" ry="6" fill="#ff7f95" opacity=".5"/><ellipse cx="38" cy="-130" rx="10" ry="6" fill="#ff7f95" opacity=".5"/>
    <path d="M -34 -114 Q ${-20 + bx * 0.4} ${-40 + Math.abs(bx) * 0.3} ${bx} ${-24 + Math.sin(t * 4) * 3} Q ${20 + bx * 0.4} ${-40 + Math.abs(bx) * 0.3} 34 -114 Q 0 -100 -34 -114 Z" fill="#f4f1ea" stroke="${OUT}" stroke-width="3" stroke-linejoin="round"/>
    ${g(mouth(mouthShape || ({ shock: 'o', happy: 'grin', worry: 'frown', angry: 'frown' }[mood] || 'smile')), 'translate(0 8) scale(.9)')}
  `, `translate(${x} ${y}) scale(${flip ? -s : s} ${s})`).replace('<g', `<g opacity="${alpha}"`);
}

// Extra cast built on person()
const tuan = o => person({ skin: '#d8a274', outfit: { shirt: '#3f9a5a', sarong: '#6b3f8f', band: '#000' }, hat: 'songkok', stache: true, ...o,
  extra: '<ellipse cx="0" cy="-70" rx="44" ry="34" fill="#3f9a5a" stroke="' + OUT + '" stroke-width="2.5"/>' });
const raja = o => person({ skin: '#d9a777', outfit: { shirt: '#f2c230', sarong: '#b02e3a', band: '#000' }, hat: 'crown', stache: true, ...o });
const nadi = o => person({ skin: '#8d5634', outfit: { shirt: '#c0392b', sarong: '#f3efe2', band: '#000' }, hat: 'turban', stache: true, ...o });
const villager = (i, o) => person({
  skin: ['#c98a5a', '#d9a274', '#b87a4b', '#e0b080'][i % 4],
  outfit: { shirt: ['#e86a92', '#55b5e6', '#9ccc4a', '#f39c3d', '#a678de'][i % 5], sarong: ['#5a4ab0', '#c04848', '#2e8b6e', '#916a3c'][i % 4], band: '#e23d3d' },
  hat: ['none', 'songkok', 'none', 'band'][i % 4], ...o,
});

// ---------------------------------------------------------------------------
// Props & scenery
// ---------------------------------------------------------------------------
function sky(top, bottom, id) {
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient></defs><rect width="${W}" height="${H + 100}" fill="url(#${id})"/>`;
}
const DAY = ['#7ed3f7', '#dff5ff'], DUSK = ['#ff9a6b', '#ffe2a8'], NIGHT = ['#14204a', '#3b4f8c'];
function sun(x, y, r = 48, t = 0) {
  let rays = '';
  for (let i = 0; i < 12; i++) { const a = i * 30 + t * 20; rays += `<rect x="-5" y="${-r - 26}" width="10" height="18" rx="5" fill="#ffd54a" transform="rotate(${a})"/>`; }
  return g(`${rays}<circle r="${r}" fill="#ffd54a" stroke="#f3a72a" stroke-width="4"/><circle cx="-14" cy="-6" r="5" fill="#7a4a12"/><circle cx="14" cy="-6" r="5" fill="#7a4a12"/><path d="M -14 12 Q 0 24 14 12" stroke="#7a4a12" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="-26" cy="8" rx="7" ry="4" fill="#ff8f6b" opacity=".6"/><ellipse cx="26" cy="8" rx="7" ry="4" fill="#ff8f6b" opacity=".6"/>`, `translate(${x} ${y + 45})`);
}
function moon(x, y) {
  return g(`<circle r="62" fill="#fff6c9" opacity=".15"/><circle r="44" fill="#fff4b8"/><circle cx="-14" cy="-10" r="8" fill="#efe19b"/><circle cx="12" cy="14" r="6" fill="#efe19b"/>`, `translate(${x} ${y + 35})`);
}
function stars(t, n = 40) {
  let s = '';
  for (let i = 0; i < n; i++) { const tw = 0.5 + 0.5 * Math.sin(t * 3 + i); s += `<circle cx="${rnd(i) * W}" cy="${60 + rnd(i + 99) * 330}" r="${1.5 + rnd(i + 7) * 2}" fill="#fff" opacity="${0.4 + tw * 0.6}"/>`; }
  return s;
}
function cloud(x, y, s = 1, op = 1) {
  return g(`<g opacity="${op}"><ellipse cx="0" cy="0" rx="60" ry="30" fill="#fff"/><circle cx="-28" cy="-14" r="28" fill="#fff"/><circle cx="16" cy="-24" r="34" fill="#fff"/><circle cx="46" cy="-6" r="24" fill="#fff"/></g>`, `translate(${x} ${y}) scale(${s})`);
}
function clouds(t, op = 1) {
  return [0, 1, 2, 3].map(i => cloud(((rnd(i) * W + t * (12 + i * 5)) % (W + 300)) - 150, 110 + rnd(i + 3) * 110, 0.7 + rnd(i + 5) * 0.6, op)).join('');
}
function hills(c1 = '#7cc66b', c2 = '#5aae55', yb = 470) {
  return `<path d="M 0 ${yb - 60} Q 200 ${yb - 170} 420 ${yb - 70} T 860 ${yb - 90} T 1280 ${yb - 80} V 820 H 0 Z" fill="${c1}"/><path d="M 0 ${yb} Q 260 ${yb - 90} 560 ${yb - 20} T 1280 ${yb - 30} V 820 H 0 Z" fill="${c2}"/>`;
}
function ground(y = 560, c = '#8bd16f', c2 = '#74bd5b') {
  return `<rect x="0" y="${y}" width="${W}" height="${H + 100 - y}" fill="${c}"/><path d="M 0 ${y} H ${W}" stroke="${c2}" stroke-width="6"/>` +
    [...Array(18)].map((_, i) => `<path d="M ${rnd(i + 40) * W} ${y + 30 + rnd(i + 2) * 120} l 6 -14 l 6 14 l 6 -12 l 4 12" stroke="${c2}" stroke-width="4" fill="none" stroke-linecap="round"/>`).join('');
}
function river(y, h, t, c = '#4aa8e0', c2 = '#7fcaf2') {
  let waves = '';
  for (let i = 0; i < 14; i++) {
    const wx = ((i * 137 + t * 30) % (W + 120)) - 60, wy = y + 18 + (i % 4) * (h - 30) / 4;
    waves += `<path d="M ${wx} ${wy} q 12 -8 24 0 q 12 8 24 0" stroke="${c2}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  }
  return `<rect x="0" y="${y}" width="${W}" height="${h + 100}" fill="${c}"/>${waves}<path d="M 0 ${y} H ${W}" stroke="#2f86bd" stroke-width="5"/>`;
}
function tree(x, y, s = 1, sway = 0, c = '#3fa34d', c2 = '#2f8a3f') {
  return g(`<path d="M -14 0 Q -10 -60 -6 -110 L 6 -110 Q 10 -60 14 0 Z" fill="#8a5a33" stroke="${OUT}" stroke-width="3"/>
    <g transform="rotate(${sway} 0 -110)"><circle cx="-40" cy="-130" r="44" fill="${c2}" stroke="${OUT}" stroke-width="3"/><circle cx="40" cy="-130" r="44" fill="${c2}" stroke="${OUT}" stroke-width="3"/><circle cx="0" cy="-170" r="56" fill="${c}" stroke="${OUT}" stroke-width="3"/><circle cx="-18" cy="-186" r="14" fill="#69c46f" opacity=".7"/></g>`,
    `translate(${x} ${y}) scale(${s})`);
}
function palm(x, y, s = 1, sway = 0) {
  let fronds = '';
  for (let i = 0; i < 6; i++) { const a = -150 + i * 40 + sway; fronds += `<path d="M 0 0 Q 50 -30 100 10 Q 50 -10 0 0" fill="#3fae4f" stroke="${OUT}" stroke-width="2.5" transform="rotate(${a})"/>`; }
  return g(`<path d="M -10 0 Q 10 -110 30 -220 L 44 -218 Q 26 -110 10 0 Z" fill="#b07a45" stroke="${OUT}" stroke-width="3"/>${g(fronds + '<circle cx="-6" cy="12" r="10" fill="#7a4a22"/><circle cx="10" cy="14" r="10" fill="#7a4a22"/>', 'translate(37 -220)')}`, `translate(${x} ${y}) scale(${s})`);
}
function bush(x, y, s = 1, c = '#4cb35a') {

// Text: bottom caption bar + speech bubbles
const wrap = (txt, max) => {
  const out = []; let line = '';
  for (const w of txt.split(' ')) { if ((line + ' ' + w).trim().length > max) { out.push(line.trim()); line = w; } else line += ' ' + w; }
  if (line.trim()) out.push(line.trim());
  return out;
};
function caption(txt, p) {
  if (!txt || p <= 0) return '';
  const lines = wrap(txt, 66), lh = 36, h = lines.length * lh + 24, y0 = 720 - h - 16;
  const op = clamp(p * 4), dy = (1 - easeOut(clamp(p * 4))) * 20;
  return g(`<rect x="110" y="${y0}" width="${W - 220}" height="${h}" rx="22" fill="rgba(255,255,255,.93)" stroke="#3b2416" stroke-width="4"/>` +
    lines.map((l, i) => `<text x="${W / 2}" y="${y0 + 42 + i * lh}" text-anchor="middle" font-size="28" font-weight="600" fill="#3b2416">${l}</text>`).join(''),
    `translate(0 ${dy})`).replace('<g', `<g opacity="${op}"`);
}
function bubble(x, y, txt, p, tail = 'down-left', c = '#fff') {
  if (p <= 0) return '';
  const lines = wrap(txt, 22), fs = 28, w = Math.max(...lines.map(l => l.length)) * fs * 0.55 + 48, h = lines.length * 36 + 30;
  const sc = back(clamp(p * 3.5));
  const tx = tail.includes('left') ? -w / 2 + 40 : w / 2 - 40;
  const tl = tail.includes('left') ? `M ${tx} ${h / 2 - 4} L ${tx - 26} ${h / 2 + 34} L ${tx + 24} ${h / 2 - 4}` : `M ${tx} ${h / 2 - 4} L ${tx + 26} ${h / 2 + 34} L ${tx - 24} ${h / 2 - 4}`;
  return g(`<path d="${tl}" fill="${c}" stroke="#3b2416" stroke-width="4" stroke-linejoin="round"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="26" fill="${c}" stroke="#3b2416" stroke-width="4"/><path d="${tl}" fill="${c}" transform="translate(0 -5)"/>` +
    lines.map((l, i) => `<text x="0" y="${-h / 2 + 42 + i * 36}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#3b2416">${l}</text>`).join(''),
    `translate(${x} ${y}) scale(${sc})`);
}

scene(12, [[0, 5.5, 'Kemudian tiba giliran Badang. Dia mengangkat batu itu tinggi ke atas kepalanya...'], [5.5, 12, '...lalu melontarkannya jauh hingga ke kuala Sungai Singapura!']], t => {

// ---------------------------------------------------------------------------
// Timeline, transitions & rendering
// ---------------------------------------------------------------------------
let acc = 0;
for (const sc of scenes) { sc.start = acc; for (const [ts, name] of sc.sfx) SFX.push([+(acc + ts).toFixed(3), name]); acc += sc.dur; }
const TOTAL = acc;
const CAPTIONS = scenes.flatMap(sc => sc.captions.map(([a, b, txt]) => [sc.start + a, sc.start + b, txt]));
window.TOTAL = TOTAL; window.SFX = SFX; window.CAPTIONS = CAPTIONS;

function iris(r) {
  return `<path d="M 0 0 H ${W} V ${H} H 0 Z M 640 360 m ${-r} 0 a ${r} ${r} 0 1 0 ${2 * r} 0 a ${r} ${r} 0 1 0 ${-2 * r} 0 Z" fill="#000" fill-rule="evenodd"/>`;
}
const defs = `<defs><radialGradient id="auraGrad"><stop offset="0" stop-color="#fff59a" stop-opacity=".9"/><stop offset=".6" stop-color="#ffd54a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd54a" stop-opacity="0"/></radialGradient></defs>`;
const stage = document.getElementById('stage');
function renderAt(T) {
  T = clamp(T, 0, TOTAL - 1e-6);
  const i = scenes.findIndex(sc => T < sc.start + sc.dur);
  const sc = scenes[i], t = T - sc.start;
  let s = defs + g(sc.draw(t), `translate(0 ${-sc.lift})`);
  for (const [a, b, txt] of sc.captions) if (t >= a && t < b) s += caption(txt, (t - a) / Math.min(1, b - a));
  // Cartoon iris wipe between scenes
  const R = 760, tin = 0.45, tout = 0.45;
  if (i > 0 && t < tin) s += iris(R * easeOut(t / tin));
  if (i < scenes.length - 1 && t > sc.dur - tout) s += iris(R * (1 - ease((t - (sc.dur - tout)) / tout)));
  if (i === scenes.length - 1 && t > sc.dur - 1) s += `<rect width="${W}" height="${H + 100}" fill="#000" opacity="${P(t, sc.dur - 1, sc.dur)}"/>`;
  if (i === 0 && t < 0.5) s += `<rect width="${W}" height="${H + 100}" fill="#000" opacity="${1 - t / 0.5}"/>`;
  stage.innerHTML = s;
}
window.renderAt = renderAt;

// YouTube thumbnail: one bold, uncluttered composition.
function renderThumbnail() {
  const t = 2.2;
  let s = defs + sky('#5fc8ff', '#c9f0ff', 'skT');
  for (let i = 0; i < 16; i++) s += `<path d="M 900 470 L ${900 + Math.cos(i / 16 * Math.PI * 2) * 1400} ${470 + Math.sin(i / 16 * Math.PI * 2) * 1400} L ${900 + Math.cos((i + 0.5) / 16 * Math.PI * 2) * 1400} ${470 + Math.sin((i + 0.5) / 16 * Math.PI * 2) * 1400} Z" fill="#fff" opacity=".18"/>`;
  s += hills('#7cc66b', '#5aae55', 620) + river(640, 120, t);
  s += palm(1210, 650, 0.9, 4);
  s += `<circle cx="900" cy="330" r="330" fill="url(#auraGrad)" opacity=".9"/>`;
  s += boulder(900, 318, 1.3, -4);
  s += person({ x: 900, y: 700, s: 1.75, outfit: 'hulubalang', mood: 'happy', armLen: 128, aL: 148, aR: 148 });
  s += sparkles(900, 300, t, 10, 300, 6);
  s += jin({ x: 1170, y: 720, s: 0.75, t, mood: 'shock', aL: 150, aR: 150 });
  const title = 'BADANG';
  [...title].forEach((ch, i) => {
    s += `<text x="${80 + i * 92}" y="${210 + (i % 2) * 14}" text-anchor="middle" font-size="150" font-weight="700" fill="${['#ff5a5a', '#ffb23f', '#ffd93d', '#5ccf6a', '#3fb6ff', '#a07bff'][i]}" stroke="#3b2416" stroke-width="14" paint-order="stroke" transform="rotate(${[-6, 4, -3, 5, -4, 6][i]} ${80 + i * 92} 160)">${ch}</text>`;
  });
  s += `<g transform="rotate(-4 280 300)"><rect x="40" y="262" width="480" height="76" rx="38" fill="#ff5a5a" stroke="#3b2416" stroke-width="6"/><text x="280" y="314" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">Si Perkasa dari Sayong</text></g>`;
  s += `<rect x="40" y="380" width="380" height="64" rx="32" fill="#fff" stroke="#3b2416" stroke-width="5"/><text x="230" y="424" text-anchor="middle" font-size="34" font-weight="600" fill="#3b2416">Cerita Rakyat Melayu</text>`;
  stage.innerHTML = s;
}
window.renderThumbnail = renderThumbnail;

// Interactive preview (skipped when the renderer drives the page)
if (!new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('preview');
  const scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), btn = document.getElementById('play');
  scrub.max = TOTAL;
  let playing = false, t0 = 0, base = 0;
  const show = T => { renderAt(T); scrub.value = T; clock.textContent = T.toFixed(1) + 's / ' + TOTAL + 's'; };
  const loop = now => { if (!playing) return; const T = base + (now - t0) / 1000; if (T >= TOTAL) { playing = false; btn.textContent = '▶ Main'; show(TOTAL); return; } show(T); requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '❚❚ Jeda' : '▶ Main'; if (playing) { base = +scrub.value >= TOTAL - 0.1 ? 0 : +scrub.value; t0 = performance.now(); requestAnimationFrame(loop); } };
  scrub.oninput = () => { playing = false; btn.textContent = '▶ Main'; show(+scrub.value); };
  const at = +new URLSearchParams(location.search).get('t') || 0;
  document.fonts.ready.then(() => show(at));
}
</script>
</body>
</html>
